name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMM_REPOSITORY: ${{ vars.LINKERBOT_COMM_REPOSITORY || format('{0}/linkerbot-transport-cpp', github.repository_owner) }}
  # Transport v0.3.4 release commit; keep checkout instructions in sync.
  COMM_REF: 0e190032d65ed0b315337b45b3779cf4f650ed68

jobs:
  build-and-test:
    name: GCC 13 / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc-13
      CXX: g++-13
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Set offline configuration directory
        run: echo "XDG_CONFIG_HOME=${RUNNER_TEMP}/xdg-config" >> "$GITHUB_ENV"

      - name: Check out hand SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hand-cpp

      - name: Check documentation and analysis helpers
        working-directory: hand-cpp
        run: |
          python3 validation/check_docs.py
          python3 -m unittest discover -s validation -p 'test_quality_tools.py'
          python3 -m unittest discover -s validation -p 'test_transport_provider.py'
          python3 -m unittest discover -s validation -p 'test_release*.py'

      - name: Check out communication library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.COMM_REPOSITORY }}
          ref: ${{ env.COMM_REF }}
          path: linkerbot-transport-cpp
          token: ${{ secrets.LINKERBOT_COMM_TOKEN || github.token }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-13 g++-13 python3

      - name: Configure
        working-directory: hand-cpp
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/linkerbot-sdk" \
            -DLINKERBOT_COMM_SOURCE_DIR="${GITHUB_WORKSPACE}/linkerbot-transport-cpp" \
            -DLINKERBOT_BUILD_EXAMPLES=OFF \
            -DLINKERBOT_BUILD_TESTS=ON \
            -DLINKERBOT_BUILD_TOOLS=ON \
            -DLINKERBOT_COMM_BUILD_TESTS=OFF

      - name: Build SDK and offline test targets
        working-directory: hand-cpp
        run: |
          cmake --build build --parallel 4 --target \
            linkerbot-cpp-sdk l6_read_version l6_frequency_benchmark \
            tests protocol-tests

      - name: Run offline tests
        working-directory: hand-cpp
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Check protocol boundaries
        if: matrix.build_type == 'Release'
        working-directory: hand-cpp
        run: |
          python3 validation/check_protocol_boundary.py \
            --source . \
            --comm-include "${GITHUB_WORKSPACE}/linkerbot-transport-cpp/include" \
            --compiler g++-13
          python3 validation/l6/check_boundary.py \
            --comm-include "${GITHUB_WORKSPACE}/linkerbot-transport-cpp/include" \
            --compiler g++-13

      - name: Install SDK for public header checks
        if: matrix.build_type == 'Release' && github.event_name != 'pull_request'
        working-directory: hand-cpp
        run: |
          cmake --build build --parallel 4
          cmake --install build

      - name: Check installed public headers
        if: matrix.build_type == 'Release' && github.event_name != 'pull_request'
        working-directory: hand-cpp
        run: |
          python3 validation/check_headers.py \
            --include "${RUNNER_TEMP}/linkerbot-sdk/include" \
            --compiler g++-13 \
            --jobs 4 \
            --output "${RUNNER_TEMP}/header-check.json"

      - name: Compile documented asynchronous examples
        if: matrix.build_type == 'Release' && github.event_name != 'pull_request'
        working-directory: hand-cpp
        run: |
          python3 validation/check_documented_examples.py \
            --prefix "${RUNNER_TEMP}/linkerbot-sdk" \
            --build-dir build-documented-examples

      - name: Check package and source dependency versions
        if: matrix.build_type == 'Release' && github.event_name != 'pull_request'
        working-directory: hand-cpp/build
        run: |
          cmake -DHAND_PREFIX="${RUNNER_TEMP}/linkerbot-sdk" \
            -P ../validation/check_package_compatibility.cmake

      - name: Build and run installed consumer without optional drivers
        if: matrix.build_type == 'Release' && github.event_name != 'pull_request'
        working-directory: hand-cpp
        run: |
          cmake -S validation/installed-consumer \
            -B build-installed-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/linkerbot-sdk"
          cmake --build build-installed-consumer --parallel 4
          ctest --test-dir build-installed-consumer \
            --output-on-failure --timeout 120

  windows-discovery:
    name: Windows x64 / ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Check out hand SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hand-cpp

      - name: Check out fixed communication library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.COMM_REPOSITORY }}
          ref: ${{ env.COMM_REF }}
          path: linkerbot-transport-cpp
          token: ${{ secrets.LINKERBOT_COMM_TOKEN || github.token }}

      - name: Install fixed CMake and record Windows tools
        run: ./hand-cpp/validation/setup_windows.ps1

      # Both suites share these build trees. PRs stop after tests; pushes to the
      # main branch retain full installation and release-package acceptance.
      - name: Check transport selection including Windows source paths
        run: python -m unittest discover -s hand-cpp/validation -p 'test_transport_provider.py'

      - name: Build once and validate both test suites
        run: |
          $QuickArgs = @()
          if ('${{ github.event_name }}' -eq 'pull_request') { $QuickArgs += '--quick' }
          python hand-cpp/validation/run_release_validation.py `
            --comm-source linkerbot-transport-cpp `
            --work-dir "${{ runner.temp }}/windows-${{ matrix.configuration }}" `
            --config ${{ matrix.configuration }} --suite all `
            --generator 'Visual Studio 17 2022' --architecture x64 --toolset 'v143,version=14.44' `
            --comm-sha '${{ env.COMM_REF }}' --hand-sha '${{ github.sha }}' --allow-downloads @QuickArgs
          if ($LASTEXITCODE -ne 0) { throw 'Windows release validation failed' }

      - name: Save build, test, consumer and package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-${{ matrix.configuration }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/windows-${{ matrix.configuration }}/evidence/
            ${{ runner.temp }}/windows-${{ matrix.configuration }}/packages/*/*.zip
            ${{ runner.temp }}/windows-${{ matrix.configuration }}/packages/*/*.sha256

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc-13
      CXX: g++-13
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Set offline configuration directory
        run: echo "XDG_CONFIG_HOME=${RUNNER_TEMP}/xdg-config" >> "$GITHUB_ENV"

      - name: Check out hand SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hand-cpp

      - name: Check out communication library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.COMM_REPOSITORY }}
          ref: ${{ env.COMM_REF }}
          path: linkerbot-transport-cpp
          token: ${{ secrets.LINKERBOT_COMM_TOKEN || github.token }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-13 g++-13

      - name: Configure sanitizer build
        working-directory: hand-cpp
        run: |
          cmake -S . -B build-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DLINKERBOT_COMM_SOURCE_DIR="${GITHUB_WORKSPACE}/linkerbot-transport-cpp" \
            -DLINKERBOT_BUILD_EXAMPLES=OFF \
            -DLINKERBOT_BUILD_TESTS=ON \
            -DLINKERBOT_BUILD_TOOLS=ON \
            -DLINKERBOT_COMM_BUILD_TESTS=OFF

      - name: Build sanitizer test targets
        working-directory: hand-cpp
        run: |
          cmake --build build-sanitized --parallel 4 --target \
            tests protocol-tests l6_read_version l6_frequency_benchmark

      - name: Run sanitizer tests
        working-directory: hand-cpp
        run: ctest --test-dir build-sanitized --output-on-failure --timeout 180
